<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #qrcode {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QR Code Generator</h1>
    <input type="text" id="urlInput" placeholder="Enter URL (e.g., Google Docs link)">
    <select id="sizeInput">
        <option value="128">Small (128x128)</option>
        <option value="256" selected>Medium (256x256)</option>
        <option value="512">Large (512x512)</option>
    </select>
    <button onclick="generateQRCode()">Generate QR Code</button>

    <div id="qrcode"></div>
</div>

<script src="qrcode.min.js"></script>
<script>
    function generateQRCode() {
        const urlInput = document.getElementById("urlInput").value;
        const qrcodeContainer = document.getElementById("qrcode");

        // Clear previous QR code
        qrcodeContainer.innerHTML = "";

        if (urlInput) {
            const sizeInput = parseInt(document.getElementById("sizeInput").value);

            // Adjust error correction level based on size for reliability
            // Small codes need lower correction to fit data, large codes can use higher
            let errorCorrection = QRCode.CorrectLevel.M;
            if (sizeInput <= 128) {
                errorCorrection = QRCode.CorrectLevel.L;
            } else if (sizeInput >= 512) {
                errorCorrection = QRCode.CorrectLevel.H;
            }

            new QRCode(qrcodeContainer, {
                text: urlInput,
                width: sizeInput,
                height: sizeInput,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : errorCorrection
            });
        } else {
            alert("Please enter a valid URL");
        }
    }
</script>

</body>
</html>
